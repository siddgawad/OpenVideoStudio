[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openvideostudio"
version = "0.1.0"
description = "Open-source conversational video-production studio: topic to release-ready YouTube package."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "Pillow>=10",
    "edge-tts>=7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
studio = "studio.cli:main"

[tool.setuptools]
packages = ["studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
